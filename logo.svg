<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AI Bot Ares">
  <defs>
    <linearGradient id="aresA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset=".5" stop-color="#6a46ff"/>
      <stop offset="1" stop-color="#c13bff"/>
    </linearGradient>
    <linearGradient id="aresOrbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6bff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#7fd3ff"/>
    </linearGradient>
    <clipPath id="aresBack"><rect x="0" y="0" width="64" height="33"/></clipPath>
    <clipPath id="aresFront"><rect x="0" y="33" width="64" height="31"/></clipPath>
  </defs>
  <!-- orbit, back half (behind the A) -->
  <ellipse cx="32" cy="35" rx="29" ry="9" transform="rotate(-18 32 35)" fill="none" stroke="url(#aresOrbit)" stroke-width="2.2" clip-path="url(#aresBack)" opacity=".75"/>
  <!-- A-house -->
  <path d="M7 55 L28 11 Q32 4 36 11 L57 55 L45.5 55 L32 26 L18.5 55 Z" fill="url(#aresA)"/>
  <!-- 2x2 window -->
  <g fill="#8fb0ff">
    <rect x="27.9" y="39" width="3.7" height="3.7" rx=".8"/>
    <rect x="32.4" y="39" width="3.7" height="3.7" rx=".8"/>
    <rect x="27.9" y="43.5" width="3.7" height="3.7" rx=".8"/>
    <rect x="32.4" y="43.5" width="3.7" height="3.7" rx=".8"/>
  </g>
  <!-- orbit, front half -->
  <ellipse cx="32" cy="35" rx="29" ry="9" transform="rotate(-18 32 35)" fill="none" stroke="url(#aresOrbit)" stroke-width="2.2" clip-path="url(#aresFront)"/>
  <!-- bright dot -->
  <circle cx="59.4" cy="26" r="3.6" fill="#7fd3ff" opacity=".35"/>
  <circle cx="59.4" cy="26" r="2.2" fill="#e8f6ff"/>
</svg>
